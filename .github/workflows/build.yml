name: Build Levi Freecam

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - name: Select build mode
        id: mode
        run: echo "mode=${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'debug' }}" >> "$GITHUB_OUTPUT"

      - name: Build and package
        env:
          XMAKE_COLORTERM: truecolor
          BUILD_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euxo pipefail
          xmake f -y -p android -a arm64-v8a -m "$BUILD_MODE" --ndk=${{ steps.ndk.outputs.ndk-path }}
          xmake -y

      - name: Verify outputs
        env:
          BUILD_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euxo pipefail
          OUT="build/android/arm64-v8a/${BUILD_MODE}"
          test -s "$OUT/liblevi_freecam.so"
          test -s "$OUT/levi_freecam.levipack"
          unzip -l "$OUT/levi_freecam.levipack"
          sha256sum "$OUT/liblevi_freecam.so" "$OUT/levi_freecam.levipack"

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: levi-freecam-1.26.52.3-${{ steps.mode.outputs.mode }}-${{ github.sha }}
          path: |
            build/android/arm64-v8a/${{ steps.mode.outputs.mode }}/levi_freecam.levipack
            build/android/arm64-v8a/${{ steps.mode.outputs.mode }}/liblevi_freecam.so
          if-no-files-found: error

      - name: Summarize CI artifact
        if: startsWith(github.ref, 'refs/tags/v') == false
        env:
          BUILD_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          echo '### CI build' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: \`$BUILD_MODE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo 'The .levipack and .so are available from the workflow artifact.' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish .levipack release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euxo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            build/android/arm64-v8a/${BUILD_MODE}/levi_freecam.levipack \
            build/android/arm64-v8a/${BUILD_MODE}/liblevi_freecam.so \
            --title "Levi Freecam ${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Print direct download link
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "Direct .levipack download:"
          echo "${{ github.server_url }}/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/levi_freecam.levipack"
          {
            echo '### Levi Freecam download'
            echo
            echo "[Download levi_freecam.levipack](${{ github.server_url }}/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/levi_freecam.levipack)"
          } >> "$GITHUB_STEP_SUMMARY"
